name: Publish open dataset

# Builds datos-abiertos/la-canasta-datos.zip from the data and publishes it as a GitHub release
# (tag datos-YYYY-MM-DD). Zenodo archives every release and gives it a DOI.
# Start it from the Actions tab ("Run workflow"), or by changing datos-abiertos/VERSION on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "datos-abiertos/VERSION"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the dataset
        run: python3 build_dataset.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="datos-$(TZ=America/Argentina/Buenos_Aires date +%F)"
          gh release create "$TAG" datos-abiertos/la-canasta-datos.zip \
            --title "La Canasta: datos abiertos (${TAG#datos-})" \
            --notes-file datos-abiertos/NOTAS-VERSION.md
