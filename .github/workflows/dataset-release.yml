name: Publish open dataset

# Builds la-canasta-datos.zip from the data and publishes it as a GitHub release (tag datos-YYYY-MM-DD).
# Zenodo archives every release as a new version of the dataset (same concept DOI). If the Kaggle
# token exists (secret KAGGLE_API_TOKEN, or the older KAGGLE_USERNAME + KAGGLE_KEY), the same files are uploaded to Kaggle as a new version.
# Runs every Sunday night, and whenever it is started from the Actions tab or datos-abiertos/VERSION changes.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 21 * * 0"   # Sundays 21:41 UTC, after the day's prices
  push:
    branches: [main]
    paths:
      - "datos-abiertos/VERSION"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the dataset
        run: python3 build_dataset.py
      - name: Publish the release (Zenodo picks it up)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="datos-$(TZ=America/Argentina/Buenos_Aires date +%F)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" datos-abiertos/la-canasta-datos.zip --clobber
          else
            gh release create "$TAG" datos-abiertos/la-canasta-datos.zip \
              --title "La Canasta: datos abiertos (${TAG#datos-})" \
              --notes-file datos-abiertos/NOTAS-VERSION.md
          fi
      - name: Update Kaggle (only when the Kaggle token exists)
        if: ${{ env.KAGGLE_API_TOKEN != '' || env.KAGGLE_KEY != '' }}
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install --quiet kaggle
          echo "token: ${#KAGGLE_API_TOKEN} characters, starts with ${KAGGLE_API_TOKEN:0:5}"
          kaggle datasets list -m --max-size 1 >/dev/null && echo "Kaggle login OK" || { echo "Kaggle login FAILED: the token is not valid"; exit 1; }
          rm -rf kg && mkdir kg && cd kg && unzip -q ../datos-abiertos/la-canasta-datos.zip
          echo '{"id": "ramonpepa/la-canasta-argentina-daily-supermarket-prices"}' > dataset-metadata.json
          kaggle datasets version -p . -m "Datos al $(TZ=America/Argentina/Buenos_Aires date +%F)" --dir-mode zip
