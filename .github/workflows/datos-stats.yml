name: Open dataset stats

# Once a day: Kaggle and Zenodo views and downloads -> index/datos-stats.json (shown in admin.html).
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [notas/pedir-datos-stats.txt]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install --quiet requests kaggle
      - name: Fetch the numbers
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          KAGGLE_API_TOKEN="$(echo "$KAGGLE_API_TOKEN" | sed 's/.*=//; s/[[:space:]]//g')"; export KAGGLE_API_TOKEN
          [ -z "$KAGGLE_API_TOKEN" ] && unset KAGGLE_API_TOKEN
          [ -z "$KAGGLE_KEY" ] && unset KAGGLE_KEY
          python3 fetch_dataset_stats.py
      - name: Save
        run: |
          git config user.name "La Canasta bot"
          git config user.email "actions@users.noreply.github.com"
          git add index/datos-stats.json index/datos-stats.csv
          git commit -m "Open dataset stats" || exit 0
          for i in 1 2 3; do git pull --rebase --quiet origin main && git push --quiet && break; sleep 10; done
