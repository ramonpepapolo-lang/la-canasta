name: Enviar emails a medios
on:
  push:
    branches: [envios]
    paths: [emails3.json]
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Send
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python3 enviar.py emails3.json resultados3.json hola@lacanastaindex.com
      - name: Save the result
        if: always()
        run: |
          git config user.name "la-canasta-bot" && git config user.email "actions@users.noreply.github.com"
          git add resultados3.json && git commit -q -m "Resultado del envío" && git push -q
