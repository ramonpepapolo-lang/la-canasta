name: Fotos de prueba
on:
  push:
    branches: [fotos-prueba]
    paths: [fotos.py]
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet requests && python3 fotos.py
      - if: always()
        run: |
          git config user.name "la-canasta-bot" && git config user.email "actions@users.noreply.github.com"
          git add img fotos.json && git commit -q -m "Fotos de prueba" && git push -q
