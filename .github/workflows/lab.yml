name: Video lab (voices and music tests)
on:
  push:
    branches: [video-lab]
    paths: [lines.json, voces.py, musica.txt, .github/workflows/lab.yml]
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng >/dev/null
      - run: pip install --quiet "kokoro>=0.9.4" soundfile "misaki[en]>=0.9.4"
      - name: Voices
        run: python voces.py
      - name: Music candidates (Kevin MacLeod, incompetech.com, CC BY 4.0)
        run: |
          mkdir -p out/music
          while read -r t; do
            [ -z "$t" ] && continue
            f="out/music/$(echo "$t" | tr ' ' '_').mp3"
            for base in "https://incompetech.com/music/royalty-free/mp3-royaltyfree" "https://incompetech.com/music/royalty-free/mp3-royaltyfree/"; do
              u="$base/$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$t")".mp3
              code=$(curl -sL -o "$f" -w "%{http_code}" "$u"); echo "$code $t"; [ "$code" = 200 ] && break
            done
            [ -s "$f" ] && file "$f" | grep -qi audio || rm -f "$f"
          done < musica.txt
          ls -la out/music
      - name: Save
        run: |
          git config user.name "la-canasta-bot" && git config user.email "actions@users.noreply.github.com"
          git add -f out && git commit -q -m "Lab results" && git push -q
