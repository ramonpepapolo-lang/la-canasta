# Tries new searches without touching main: the result (probe.csv.gz) goes to the separate branch "probe".
name: Probar búsquedas
on:
  workflow_dispatch:
    inputs:
      terms:
        description: "Searches separated by commas (empty = the EXTRA_SEARCHES list)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python probe_searches.py "${{ github.event.inputs.terms }}"
      - name: Save the result on the "probe" branch (never on main)
        run: |
          mkdir /tmp/out && mv probe.csv.gz /tmp/out/
          cd /tmp/out && git init -q && git checkout -q -b probe
          git config user.name "la-canasta-bot" && git config user.email "actions@users.noreply.github.com"
          git add probe.csv.gz && git commit -q -m "Probe of searches"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
