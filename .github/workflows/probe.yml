name: Investigate Coto

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python probe_coto.py > coto_probe.txt 2>&1 || true
      - run: |
          git config user.name "la-canasta-bot"
          git config user.email "la-canasta-bot@users.noreply.github.com"
          git add coto_probe.txt
          git commit -m "Coto investigation results" || echo "Nothing new"
          git push
