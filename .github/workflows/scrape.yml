name: Daily supermarket prices

on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scrape_supermarkets.py
      - name: Save the data
        run: |
          git config user.name "la-canasta-bot"
          git config user.email "la-canasta-bot@users.noreply.github.com"
          git add data
          git commit -m "Prices for $(date +%F)" || echo "Nothing new"
          git push
