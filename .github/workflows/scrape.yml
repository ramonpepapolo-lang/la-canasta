name: Daily supermarket prices

# 5 tries a day, all inside the same Argentine day (UTC-3):
#   13:23 UTC = 14:23 Spain = 10:23 Argentina  (main run)
#   15:17 UTC, 16:47 UTC, 20:11 UTC, 23:07 UTC  (backups)
# GitHub sometimes delays or skips scheduled runs. A backup only collects prices
# if today's are still missing, so prices are always taken as early as possible.
# "Today" is always the ARGENTINE date, and nothing is collected before 9:00 in Argentina,
# so a run that GitHub starts hours late can never be saved under the wrong day.
# If a run cannot save today's prices, it fails, and GitHub emails the owner.
# An outside alarm clock (cron-job.org) also starts this workflow every day, because
# GitHub's own clock can be hours late. Those starts also skip if today is already saved.
# To collect again on purpose, start it by hand and tick "force".
on:
  schedule:
    - cron: "23 13 * * *"
    - cron: "17 15 * * *"
    - cron: "47 16 * * *"
    - cron: "11 20 * * *"
    - cron: "7 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Collect again even if today's prices are already saved"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Already collected today? (Argentine date)
        id: check
        run: |
          git pull --quiet origin main || true
          AR_DATE=$(TZ=America/Argentina/Buenos_Aires date +%F)
          AR_HOUR=$(TZ=America/Argentina/Buenos_Aires date +%-H)
          echo "Argentina now: $AR_DATE, hour $AR_HOUR"
          echo "ar_date=$AR_DATE" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "done=no" >> "$GITHUB_OUTPUT"
          elif [ "$AR_HOUR" -lt 9 ]; then
            echo "done=yes" >> "$GITHUB_OUTPUT"
            echo "Too early in Argentina (before 9:00). Prices are only collected from 9:00 Argentine time."
          elif [ -f "data/$AR_DATE.csv.gz" ]; then
            echo "done=yes" >> "$GITHUB_OUTPUT"
            echo "Today's prices are already saved. Nothing to do."
          else
            echo "done=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.done == 'no'
        with:
          python-version: "3.12"
      - if: steps.check.outputs.done == 'no'
        run: pip install requests
      - if: steps.check.outputs.done == 'no'
        run: python scrape_supermarkets.py
      - if: steps.check.outputs.done == 'no'
        run: python compute_index.py
      - name: Check the index independently (never stops the prices being saved)
        id: verify
        if: steps.check.outputs.done == 'no'
        continue-on-error: true
        run: python verify_index.py
      - name: Email the monthly report (only once Ramon approved it and the check passed)
        if: steps.check.outputs.done == 'no'
        continue-on-error: true
        run: python send_report_email.py
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER: ${{ secrets.BREVO_SENDER }}
      - name: Save the data and the index
        if: steps.check.outputs.done == 'no'
        run: |
          git config user.name "la-canasta-bot"
          git config user.email "la-canasta-bot@users.noreply.github.com"
          git add data index
          git commit -m "Prices and index for ${{ steps.check.outputs.ar_date }}" || echo "Nothing new"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push failed, trying again in 20 seconds"; sleep 20
          done
      - name: Check today's prices are really saved
        if: steps.check.outputs.done == 'no'
        run: |
          git fetch --quiet origin main
          if git cat-file -e "origin/main:data/${{ steps.check.outputs.ar_date }}.csv.gz" 2>/dev/null; then
            echo "OK: today's prices are saved on GitHub."
          else
            echo "PROBLEM: today's prices are NOT saved. The next backup run will try again."
            exit 1
          fi
      - name: Email Ramon that today's prices are saved (with checks)
        if: steps.check.outputs.done == 'no'
        run: python alert_email.py --ok
        env:
          VERIFY: ${{ steps.verify.outcome }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER: ${{ secrets.BREVO_SENDER }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
      - name: Email Ramon if this run failed
        if: failure()
        run: |
          python3 alert_email.py --fail "La corrida de las $(TZ=Europe/Madrid date +%H:%M) (hora de España) falló. Detalle: $RUN_URL"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER: ${{ secrets.BREVO_SENDER }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
