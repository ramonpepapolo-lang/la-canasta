name: SEPA probe
on:
  push:
    branches: [sepa-lab]
    paths: [probe.py, probe2.py, .github/workflows/sepa.yml, pedido.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out && python3 probe.py
      - name: Step 2 (only if probe2.py exists)
        run: |
          if [ -f probe2.py ]; then
            git clone -q --depth 3 --filter=blob:none https://github.com/${{ github.repository }} main || true
            df -h . | tail -1
            python3 probe2.py 2>&1 | tail -150 | tee out/probe2.log
          fi
      - name: Save
        if: always()
        run: |
          git config user.name "la-canasta-bot" && git config user.email "actions@users.noreply.github.com"
          git add -f out && git commit -q -m "SEPA probe results" && git push -q || true
