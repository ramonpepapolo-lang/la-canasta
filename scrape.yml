name: Daily supermarket prices

on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scrape_supermarkets.py
      - run: python compute_index.py
      - name: Email the monthly report (only on the 1st, only once)
        run: python send_report_email.py
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER: ${{ secrets.BREVO_SENDER }}
      - name: Save the data and the index
        run: |
          git config user.name "la-canasta-bot"
          git config user.email "la-canasta-bot@users.noreply.github.com"
          git add data index
          git commit -m "Prices and index for $(date +%F)" || echo "Nothing new"
          git push
